name: retailflow
version: '1.0.0'
config-version: 2
profile: retailflow
model-paths: [models]
macro-paths: [macros]
clean-targets: [target, dbt_packages]
models:
  retailflow:
    catalog:
      +enabled: "{{ var('product_catalog', false) }}"
      +tags: [catalog]
    reporting:
      +enabled: "{{ var('sales_reporting', false) }}"
      +tags: [reporting]
    customers:
      +enabled: "{{ var('customer_pipeline', false) }}"
      +tags: [customers]
    parallel:
      +enabled: "{{ var('parallel_ingestion', false) }}"
      +tags: [parallel]
data_tests:
  retailflow:
    catalog:
      +enabled: "{{ var('product_catalog', false) }}"
      +tags: [catalog]
    reporting:
      +enabled: "{{ var('sales_reporting', false) }}"
      +tags: [reporting]
    customers:
      +enabled: "{{ var('customer_pipeline', false) }}"
      +tags: [customers]
    parallel:
      +enabled: "{{ var('parallel_ingestion', false) }}"
      +tags: [parallel]
