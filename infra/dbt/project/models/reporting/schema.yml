version: 2
models:
  - name: daily_sales
    description: >-
      Daily sales by dataset, UTC date, country, product and original currency.
      Revenue is the exact sum of covered EUR cents only; NULL if no order is
      covered. Uncovered orders remain visible in counts and units. Dataset
      profiles must be selected separately in the dashboard.
    data_tests:
      - unique_business_key:
          arguments:
            columns: [dataset_id, order_date, country_code, product_id, currency_code]
    columns:
      - name: dataset_id
        data_tests: [not_null]
      - name: order_date
        data_tests: [not_null]
      - name: country_code
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]
      - name: currency_code
        data_tests: [not_null]
      - name: latest_order_at
        data_tests: [not_null]
