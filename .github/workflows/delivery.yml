name: Prepare delivery

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      full_validation: true
  package:
    name: Package validated commit
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12.16"
          enable-cache: false
      - name: Package source and checksums
        run: uv run --no-project --python 3.12.16 python -m scripts.release_bundle
      - name: Deliver source package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retailflow-source-${{ github.sha }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 1
