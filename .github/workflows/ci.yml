name: CI

"on":
  push:
    branches: [main, feature/agentic-ai]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      full_validation:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select coverage and check source safety
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      checks: ${{ steps.select.outputs.checks }}
      terraform: ${{ steps.select.outputs.terraform }}
      dependencies: ${{ steps.select.outputs.dependencies }}
      workflows: ${{ steps.select.outputs.workflows }}
      integration: ${{ steps.select.outputs.integration }}
      tests: ${{ steps.select.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12.16"
          enable-cache: false
      - run: uv sync --locked
      - name: Secret and operational-file gate
        run: uv run --locked python -m scripts.ci_safety
      - id: select
        name: Select jobs and tests
        env:
          RETAILFLOW_FULL_VALIDATION: ${{ inputs.full_validation == true }}
        run: uv run --locked python -m scripts.ci_select

  checks:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12.16"
          enable-cache: false
      - run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check retailflow retailflow_ai dags infra scripts tests
      - name: Format
        run: uv run --locked ruff format --check retailflow retailflow_ai dags infra scripts tests
      - name: SQL lint
        run: uv run --locked sqlfluff lint infra/dbt/project
      - name: Python security checks
        run: uv run --locked bandit -r retailflow retailflow_ai dags infra/duckdb infra/dbt/run.py infra/dbt/reporting.py infra/dbt/catalog_reporting.py infra/dashboard/app.py infra/dashboard/catalog_page.py infra/dashboard/analyst_page.py infra/mongodb/catalog.py infra/mongodb/extract.py infra/orchestration/start.py scripts -q
      - name: Tests
        env:
          RETAILFLOW_SELECTED_TESTS: ${{ needs.changes.outputs.tests }}
        run: uv run --locked python -m scripts.ci_select --run-tests --junitxml=artifacts/unit-tests.xml

  infrastructure:
    needs: changes
    if: needs.changes.outputs.terraform == 'true' || needs.changes.outputs.dependencies == 'true' || needs.changes.outputs.workflows == 'true'
    name: Infrastructure and dependency checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12.16"
          enable-cache: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - run: uv sync --locked
      - run: terraform -chdir=infra/local fmt -check
        if: needs.changes.outputs.terraform == 'true'
      - name: Validate workflow syntax
        if: needs.changes.outputs.workflows == 'true'
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= .github/workflows/ci.yml .github/workflows/delivery.yml
      - run: terraform -chdir=infra/local init -backend=false -input=false -lockfile=readonly
        if: needs.changes.outputs.terraform == 'true'
      - run: terraform -chdir=infra/local validate
        if: needs.changes.outputs.terraform == 'true'
      - name: Validate isolated catalog infrastructure
        if: needs.changes.outputs.terraform == 'true'
        run: |
          terraform -chdir=infra/mongodb/terraform fmt -check
          terraform -chdir=infra/mongodb/terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/mongodb/terraform validate
      - name: Test image rebuild boundaries with Terraform
        if: needs.changes.outputs.terraform == 'true'
        run: uv run --locked python -m pytest tests/test_image_inputs.py -q -p no:cacheprovider
      - name: Audit locked runtime dependencies
        if: needs.changes.outputs.dependencies == 'true'
        shell: bash
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/root-requirements.txt" --quiet
          uv export --project infra/dbt --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/dbt-requirements.txt" --quiet
          uv export --project infra/dashboard --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/dashboard-requirements.txt" --quiet
          uv export --project infra/analyst --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/analyst-requirements.txt" --quiet
          uv export --project infra/mongodb --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/catalog-requirements.txt" --quiet
          uv export --project infra/mongodb/extraction --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/catalog-extraction-requirements.txt" --quiet
          uv run --locked pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/root-requirements.txt"
          uv run --locked pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/dbt-requirements.txt"
          uv run --locked pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/dashboard-requirements.txt"
          uv run --locked pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/analyst-requirements.txt"
          uv run --locked pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/catalog-requirements.txt"
          uv run --locked pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/catalog-extraction-requirements.txt"

  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    name: Docker and data pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RETAILFLOW_TEST_AZURITE: "1"
      RETAILFLOW_TEST_DUCKDB_IMAGE: "1"
      RETAILFLOW_TEST_AIRFLOW_IMAGE: "1"
      RETAILFLOW_TEST_DBT_IMAGE: "1"
      RETAILFLOW_TEST_MAILPIT_IMAGE: "1"
      RETAILFLOW_TEST_PARALLEL_IMAGES: "1"
      RETAILFLOW_TEST_DASHBOARD_IMAGE: "1"
      RETAILFLOW_TEST_MONGODB_IMAGE: "1"
      RETAILFLOW_TEST_ANALYST_IMAGE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12.16"
          enable-cache: false
      - run: uv sync --locked
      - name: Require PowerShell for developer-command tests
        shell: pwsh
        run: $PSVersionTable.PSVersion
      - name: Start disposable local blob emulator
        shell: bash
        run: |
          key="$(python -c 'import base64,secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())')"
          echo "::add-mask::$key"
          echo "AZURITE_ACCOUNT_KEY=$key" >> "$GITHUB_ENV"
          docker run --detach --name retailflow-ci-azurite --publish 127.0.0.1:10000:10000 --env "AZURITE_ACCOUNTS=retailflow:$key" mcr.microsoft.com/azure-storage/azurite:3.37.0 azurite-blob --blobHost 0.0.0.0 --location /data --disableTelemetry
      - name: Build validation images
        run: |
          docker build --provenance=false --tag retailflow-duckdb:validation infra/duckdb
          docker build --provenance=false --tag retailflow-dbt:validation infra/dbt
          docker build --provenance=false --tag retailflow-mailpit:validation infra/mailpit
          docker build --provenance=false --file infra/orchestration/api.Dockerfile --tag retailflow-orders-api:validation .
          docker build --provenance=false --file infra/orchestration/airflow.Dockerfile --tag retailflow-airflow:validation .
          docker build --provenance=false --file infra/parallel/Dockerfile --tag retailflow-parallel:validation .
          docker build --provenance=false --file infra/dashboard/Dockerfile --tag retailflow-dashboard:validation .
          docker build --provenance=false --file infra/analyst/Dockerfile --tag retailflow-analyst:validation .
          docker build --provenance=false --file infra/mongodb/server.Dockerfile --tag retailflow-mongodb:validation infra/mongodb
          docker build --provenance=false --file infra/mongodb/client.Dockerfile --tag retailflow-catalog:validation infra/mongodb
          docker build --provenance=false --file infra/mongodb/extraction/Dockerfile --tag retailflow-catalog-extraction:validation .
      - name: Selected tests using disposable data
        env:
          RETAILFLOW_SELECTED_TESTS: ${{ needs.changes.outputs.tests }}
        run: uv run --locked python -m scripts.ci_select --run-tests --junitxml=artifacts/integration-tests.xml
      - name: Retain test summary only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-summary
          path: artifacts/integration-tests.xml
          if-no-files-found: ignore
          retention-days: 1
